<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Authenticating with OpenStreetMap...</title>
    <script>
      window.onload = function () {
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        const state = params.get("state");
        const error = params.get("error");

        if (code) {
          localStorage.setItem("osmAuthCode", code);
          localStorage.setItem("osmAuthState", state || "");
          document.getElementById("message").textContent = "Success! You can now close this tab.";
        } else if (error) {
          localStorage.setItem("osmAuthError", error);
          document.getElementById("message").textContent =
            "Authentication failed or was denied. Please try again.";
        }

        window.close();
      };
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding-top: 50px">
    <p id="message">Processing authentication...</p>
  </body>
</html>
