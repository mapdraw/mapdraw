  <body data-nosnippet>
    <div id="map">
      <div id="top-right-container">
        <button id="fullscreen-btn" class="top-right-btn" title="Toggle Fullscreen (f)">
          <span class="icon-fullscreen-enter material-symbols">fullscreen</span>
          <span class="icon-fullscreen-exit material-symbols">fullscreen_exit</span>
        </button>
        <button id="sidebar-toggle-btn" class="top-right-btn panels-visible" title="Toggle Sidebar">
          <span class="icon-chevron-right material-symbols">keyboard_arrow_right</span>
          <span class="icon-chevron-left material-symbols">keyboard_arrow_left</span>
        </button>
        <button id="poi-finder-btn" class="top-right-btn" title="Find Places">Find Places</button>
        <button id="search-btn" class="top-right-btn" title="Search for addresses and coordinates">
          <span class="material-symbols">search</span>
        </button>
        <div id="offline-indicator">
          <span class="material-symbols">sentiment_dissatisfied</span>OFFLINE
        </div>
      </div>

      <div id="main-right-container">
        <div id="sheet-handle">
          <span class="sheet-arrow-up material-symbols">keyboard_arrow_up</span>
          <span class="sheet-arrow-down material-symbols">keyboard_arrow_down</span>
        </div>
        <div id="info-panel">
          <textarea id="info-panel-name" rows="1"></textarea>
          <p id="info-panel-details"></p>
          <p id="info-panel-edit-hint" style="display: none"></p>
          <a id="info-panel-strava-link" href="" target="_blank" rel="noopener noreferrer"></a>
          <div id="info-panel-style-row">
            <div id="info-panel-color-swatch" title="Change color"></div>
            <span id="info-panel-layer-name"></span>
          </div>
          <div id="color-picker"></div>
        </div>

        <div id="tab-container">
          <div id="tab-buttons">
            <button id="tab-btn-overview" class="tab-button active" data-target="overview-panel">
              Contents
            </button>
            <button id="tab-btn-routing" class="tab-button" data-target="routing-panel">
              Routing
              <span id="routing-info-icon" class="material-symbols" title="Routing Help">info</span>
            </button>
            <button id="tab-btn-strava" class="tab-button" data-target="strava-panel">
              Strava
            </button>
            <button
              id="tab-btn-data"
              class="tab-button"
              data-target="data-editor-panel"
              title="GeoJSON Editor"
            >
              <span class="material-symbols">data_object</span>
            </button>
            <button
              id="tab-btn-settings"
              class="tab-button"
              data-target="settings-panel"
              title="Settings"
            >
              <span class="material-symbols material-symbols-fill">settings</span>
            </button>
            <button id="tab-btn-credits" class="js-show-credits" title="About">
              <span class="material-symbols">info</span>
            </button>
          </div>

          <div id="tab-content">
            <div id="overview-panel" class="tab-panel active">
              <div id="overview-panel-list"></div>
            </div>

            <div id="routing-panel" class="tab-panel">
              <div id="routing-panel-content">
                <div class="panel-input-group">
                  <input type="text" id="route-start" placeholder="Start" autocomplete="off" />
                  <button id="select-start-on-map" title="Select start point on map">
                    <span class="material-symbols material-symbols-fill routing-panel-icon"
                      >location_on</span
                    >
                  </button>
                  <button
                    id="use-current-location-start"
                    title="Use my current location for start point"
                  >
                    <span class="material-symbols routing-panel-icon">my_location</span>
                  </button>
                  <button id="clear-point-start" title="Clear start point">
                    <span class="material-symbols material-symbols-fill routing-panel-icon"
                      >cancel</span
                    >
                  </button>
                </div>
                <div class="panel-input-group" id="routing-via-group">
                  <input
                    type="text"
                    id="route-via"
                    placeholder="Via (optional)"
                    autocomplete="off"
                  />
                  <button id="select-via-on-map" title="Select via point on map">
                    <span class="material-symbols material-symbols-fill routing-panel-icon"
                      >location_on</span
                    >
                  </button>
                  <button
                    id="use-current-location-via"
                    title="Use my current location for via point"
                  >
                    <span class="material-symbols routing-panel-icon">my_location</span>
                  </button>
                  <button id="clear-point-via" title="Clear via point">
                    <span class="material-symbols material-symbols-fill routing-panel-icon"
                      >cancel</span
                    >
                  </button>
                </div>
                <div class="panel-input-group">
                  <input type="text" id="route-end" placeholder="End" autocomplete="off" />
                  <button id="select-end-on-map" title="Select end point on map">
                    <span class="material-symbols material-symbols-fill routing-panel-icon"
                      >location_on</span
                    >
                  </button>
                  <button
                    id="use-current-location-end"
                    title="Use my current location for end point"
                  >
                    <span class="material-symbols routing-panel-icon">my_location</span>
                  </button>
                  <button id="clear-point-end" title="Clear end point">
                    <span class="material-symbols material-symbols-fill routing-panel-icon"
                      >cancel</span
                    >
                  </button>
                </div>
                <div class="panel-input-group">
                  <div id="routing-profile-selector" class="routing-profile-selector">
                    <button class="profile-btn active" data-profile="driving" title="Driving">
                      <span class="material-symbols">directions_car</span>
                    </button>
                    <button class="profile-btn" data-profile="bike" title="Cycling">
                      <span class="material-symbols">directions_bike</span>
                    </button>
                    <button class="profile-btn" data-profile="foot" title="Walking">
                      <span class="material-symbols">directions_walk</span>
                    </button>
                  </div>
                  <button
                    id="routing-pen-btn"
                    title="Draw route step by step: first click sets start, second sets end, each next click extends the route"
                  >
                    <span class="material-symbols routing-panel-icon">draw</span>
                  </button>
                  <button id="save-route-btn" title="Save current route to the map">Save</button>
                  <button id="clear-route-btn" title="Clear the current route and all points">
                    Clear
                  </button>
                </div>
                <div
                  id="routing-summary-container"
                  style="
                    display: none;
                    font-size: var(--font-size-12);
                    margin: 0;
                    text-align: center;
                    padding: 0;
                  "
                ></div>
                <div id="directions-panel" class="collapsed">
                  <div id="directions-panel-header">
                    <span class="directions-panel-header-arrow material-symbols"></span>Directions
                  </div>
                  <div id="directions-list"></div>
                </div>
              </div>
            </div>
            <div id="strava-panel" class="tab-panel">
              <div id="strava-panel-content">
                <p style="padding: 15px; text-align: center">
                  Connect with Strava to see your activities on the map.
                </p>
              </div>
            </div>
            <div id="data-editor-panel" class="tab-panel">
              <div id="data-editor-notice">Excludes Strava activities and unsaved routes.</div>
              <textarea
                id="data-editor-textarea"
                spellcheck="false"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
              ></textarea>
              <div id="data-editor-error" role="alert"></div>
              <div id="data-editor-actions">
                <button id="data-editor-restore" title="Discard edits and reset to map">
                  Reset
                </button>
                <button id="data-editor-apply" title="Apply to map">Apply</button>
                <button id="data-editor-find" title="Jump to selected feature">
                  Go to Selected
                </button>
                <button id="data-editor-copy" title="Copy GeoJSON with all properties">
                  Copy Raw
                </button>
                <button id="data-editor-copy-clean" title="Copy GeoJSON without properties">
                  Copy Clean
                </button>
              </div>
            </div>
            <div id="settings-panel" class="tab-panel"></div>
          </div>
        </div>
      </div>

      <div id="custom-layers-panel"></div>
      <div id="elevation-div"></div>
      <div id="bottom-left-credits">
        <a href="#" id="credits-link" class="js-show-credits" title="Credits"
          ><span class="material-symbols material-symbols-fill credits-heart-icon"
            >favorite</span
          ></a
        ><a href="#" id="install-pwa-link" title="Install App" style="display: none">Install</a>
      </div>
      <div id="custom-cursor-start" class="custom-cursor">
        <span class="material-symbols material-symbols-fill material-symbols-map-marker"
          >location_on</span
        >
      </div>
      <div id="custom-cursor-end" class="custom-cursor">
        <span class="material-symbols material-symbols-fill material-symbols-map-marker"
          >location_on</span
        >
      </div>
      <div id="custom-cursor-via" class="custom-cursor">
        <span class="material-symbols material-symbols-fill material-symbols-map-marker"
          >location_on</span
        >
      </div>
    </div>
