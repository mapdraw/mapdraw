<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Leaflet 2 Test Page</title>

    <link rel="stylesheet" href="/leaflet-2.0.0-alpha.1/leaflet.css" />
    <script src="/leaflet-2.0.0-alpha.1/leaflet-global.js"></script>

    <!-- <link rel="stylesheet" href="https://unpkg.com/leaflet@2.0.0-alpha.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@2.0.0-alpha.1/dist/leaflet-global.js"></script> -->

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #readout {
        position: absolute;
        z-index: 1000;
        top: 0;
        left: 50px; /* clear of the zoom buttons */
        margin: 0;
        padding: 8px;
        background: #000;
        color: #0f0;
        font:
          13px/1.5 ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <pre id="readout"></pre>
    <div id="map"></div>

    <script>
      const map = new L.Map("map", { center: [47.3769, 8.5417], zoom: 13 });
      new L.TileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);

      const readout = document.getElementById("readout");
      function report() {
        const c = map.getCenter();
        readout.textContent =
          `leaflet          ${L.version}\n` +
          `devicePixelRatio ${devicePixelRatio}\n` +
          `zoom             ${map.getZoom()}\n` +
          `center           ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}\n` +
          `map pane         ${getComputedStyle(document.querySelector(".leaflet-map-pane")).transform}`;
      }
      map.on("move moveend", report);
      report();
    </script>
  </body>
</html>
